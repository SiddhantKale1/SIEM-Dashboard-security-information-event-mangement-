version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_siem_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_DIR=/app/siem_data
      - JWT_SECRET=sentinel-siem-prod-jwt-secret-key-change-me-32-chars
    volumes:
      - siem_data:/app/siem_data
    restart: unless-stopped
    networks:
      - siem-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_siem_frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=/api/v1
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - siem-network

volumes:
  siem_data:

networks:
  siem-network:
    driver: bridge
