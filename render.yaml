services:
  - type: web
    name: siem-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o siem-server ./cmd/server
    startCommand: ./siem-server
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_DIR
        value: "siem_data"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN_REGEX
        value: "^https?://.*$"
